name: Build & Deploy Ahhachul One App

on:
  push:
    branches:
      - main
      # 추후 develop 브렌치는 제외
      - develop
    paths:
      - 'packages/**'
      - 'services/one-app/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
  workflow_dispatch:

env:
  DEFAULT_NODE_VERSION: '20.13.0'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse secrets from JSON
        run: |
          echo '${{ secrets.DEV_META_DATA }}' > meta.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' meta.json >> $GITHUB_ENV

          for secret_key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            secret_value=$(jq -r --arg key "$secret_key" '.[$key] // empty' meta.json)
            if [ -n "$secret_value" ]; then
              echo "::add-mask::$secret_value"
            fi
          done

          for required_key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION ECR_REPOSITORY_URI ECS_CLUSTER_NAME ECS_SERVICE_NAME CONTAINER_NAME CONTAINER_PORT CODEDEPLOY_APP_NAME CODEDEPLOY_DEPLOYMENT_GROUP; do
            required_value=$(jq -r --arg key "$required_key" '.[$key] // empty' meta.json)
            if [ -z "$required_value" ]; then
              echo "Missing required key in DEV_META_DATA: $required_key" >&2
              exit 1
            fi
          done

      - name: Print AWS Region
        run: echo "AWS_REGION is $AWS_REGION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEFAULT_NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Create .env file for one-app
        run: |
          PRIMARY_CONFIG='${{ secrets.DEV_ONE_APP_CONFIG }}'
          FALLBACK_CONFIG='${{ secrets.DEV_NEXTJS_APP_CONFIG }}'

          if [ -n "$FALLBACK_CONFIG" ] && [ "$FALLBACK_CONFIG" != "null" ]; then
            echo "$FALLBACK_CONFIG" > config-fallback.json
          else
            echo '{}' > config-fallback.json
          fi

          if [ -n "$PRIMARY_CONFIG" ] && [ "$PRIMARY_CONFIG" != "null" ]; then
            echo "$PRIMARY_CONFIG" > config-primary.json
          else
            echo '{}' > config-primary.json
          fi

          jq -s 'reduce .[] as $item ({}; . * $item)' config-fallback.json config-primary.json > config.json

          if [ "$(jq -r 'keys | length' config.json)" -eq 0 ]; then
            echo "Both DEV_ONE_APP_CONFIG and DEV_NEXTJS_APP_CONFIG are empty." >&2
            exit 1
          fi

          jq -r 'to_entries[] | "\(.key)=\(.value)"' config.json > services/one-app/.env

      - name: Resolve smoke base url
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BASE_URL=$(jq -r '.NEXT_PUBLIC_SITE_URL_PRODUCTION // .APP_PRODUCTION_URL // .NEXT_PUBLIC_SITE_URL // .SITE_URL // .NEXT_PUBLIC_SITE_URL_STAGING // empty' config.json)
          else
            BASE_URL=$(jq -r '.NEXT_PUBLIC_SITE_URL_STAGING // .NEXT_PUBLIC_SITE_URL_DEV // .APP_DEV_URL // .NEXT_PUBLIC_SITE_URL // .SITE_URL // .NEXT_PUBLIC_SITE_URL_PRODUCTION // .APP_PRODUCTION_URL // empty' config.json)
          fi

          if [ -z "$BASE_URL" ]; then
            echo "SMOKE_CHECK_ENABLED=false" >> $GITHUB_ENV
            echo "Smoke base URL is not configured in DEV_ONE_APP_CONFIG/DEV_NEXTJS_APP_CONFIG. Deployment will continue and smoke check will be skipped."
          else
            echo "SMOKE_CHECK_ENABLED=true" >> $GITHUB_ENV
            echo "SMOKE_BASE_URL=$BASE_URL" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.ECR_REPOSITORY_URI }}

      - name: Set immutable image tag
        run: echo "IMAGE_TAG=one-app-${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Build Docker image for one-app
        run: docker build -t ${{ env.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }} -f Dockerfile .

      - name: Push Docker image for one-app to Amazon ECR
        run: docker push ${{ env.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }}

      - name: Get the latest Task Definition ARN for one-app
        id: task_definition_one_app
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} \
            --query 'services[0].taskDefinition' --output text)
          echo "TASK_DEF_ARN_ONE_APP=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Register new task definition with immutable image
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN_ONE_APP" \
            --query 'taskDefinition' \
            --output json > current-task-def.json

          jq \
            --arg IMAGE "${{ env.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }}" \
            --arg CONTAINER_NAME "${{ env.CONTAINER_NAME }}" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
            | .containerDefinitions = (.containerDefinitions | map(if .name == $CONTAINER_NAME then .image = $IMAGE else . end))' \
            current-task-def.json > next-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://next-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Generate appspec.yaml for one-app
        run: |
          cat <<EOF > ./appspec-one-app.yaml
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: "$NEW_TASK_DEF_ARN"
                  LoadBalancerInfo:
                    ContainerName: ${{ env.CONTAINER_NAME }}
                    ContainerPort: ${{ env.CONTAINER_PORT }}
                  CapacityProviderStrategy:
                  - CapacityProvider: "FARGATE_SPOT"
                    Base: 0
                    Weight: 1
          EOF

      - name: Create Codedeploy deployment for one-app
        run: |
          APPSPEC_CONTENT=$(cat appspec-one-app.yaml | jq -sR .)
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":$APPSPEC_CONTENT}}" \
            --query 'deploymentId' \
            --output text)
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      - name: Wait for Codedeploy completion
        run: |
          aws deploy wait deployment-successful --deployment-id ${{ env.DEPLOYMENT_ID }}

      - name: Smoke check chunk availability
        if: env.SMOKE_CHECK_ENABLED == 'true'
        run: |
          node scripts/deploy-smoke-check.mjs \
            --product=next \
            --base-url="${SMOKE_BASE_URL}" \
            --routes="/,/community,/complaint,/lost-found,/login"
